services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: getsorted
      POSTGRES_USER: getsorted
      POSTGRES_PASSWORD: getsorted
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      target: dev
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://getsorted:getsorted@db:5432/getsorted
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Read-only so vite.config.ts can shell out to `git rev-parse` for the
      # build-SHA badge in local dev too — the working tree itself isn't
      # here (only frontend/ is bind-mounted above), just the metadata git
      # needs to resolve the current commit.
      - ./.git:/app/.git:ro
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      # Same underlying client as the backend's GOOGLE_OAUTH_CLIENT_ID above —
      # this half is public (baked into the bundle), so it's fine client-side.
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      # Overrides vite.config.ts's own `git rev-parse` detection if set —
      # not needed for the common case, just an escape hatch.
      VITE_GIT_SHA: ${VITE_GIT_SHA:-}
    depends_on:
      - backend

volumes:
  postgres_data:
